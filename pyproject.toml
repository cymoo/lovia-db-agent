[project]
name = "lovia-db-agent"
version = "0.1.0"
description = "Ask your PostgreSQL / MySQL database in plain language; answers come back as interactive tables and charts. Built on lovia."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "lovia[web]>=0.9.80",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "asyncmy>=0.2.9",
    "cryptography>=42",  # MySQL 8's default auth (caching_sha2_password) needs it

    "sqlglot>=25",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
lovia-db-agent = "db_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["db_agent"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
